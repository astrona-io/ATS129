# Manage Tekton With The Operator And The Pruner (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs OS prep, then stays running for free
# exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-129-playground-020-01"
  docs:
    guide: "docs/overview.md"
bootstrap:
  init:
    - name: "prepare"
      description: "Install the tkn CLI 0.46.2 and the Tekton Operator v0.81.2 without a TektonConfig, so the reader installs Tekton through the Operator."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "The namespace starfleet, where every Task and TaskRun runs."
      type: "file"
      source: "manifests/lab-start.yaml"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - busybox:1.37.0
