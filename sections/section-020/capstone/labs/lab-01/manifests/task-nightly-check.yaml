# A one-step Task that every team runs many times a day. The parameter
# outcome decides whether the run succeeds (pass) or fails (fail), so the
# pruning rules for successful and failed runs can both be seen.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nightly-check
  namespace: starfleet
spec:
  params:
    - name: outcome
      type: string
      default: pass
  steps:
    - name: check
      image: busybox:1.37.0
      script: |
        #!/bin/sh
        echo "nightly check: $(params.outcome)"
        [ "$(params.outcome)" = "pass" ]
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nightly-check
  namespace: outpost
spec:
  params:
    - name: outcome
      type: string
      default: pass
  steps:
    - name: check
      image: busybox:1.37.0
      script: |
        #!/bin/sh
        echo "nightly check: $(params.outcome)"
        [ "$(params.outcome)" = "pass" ]
