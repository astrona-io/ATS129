# Starting state for every ATS129 environment about monitoring:
#   - the namespace starfleet, where every Task and TaskRun runs,
#   - the namespace monitoring with a small Prometheus server
#     (prom/prometheus:v3.15.1) and a
#     client pod (nicolaka/netshoot:v0.13) with curl and jq for API calls.
# Prometheus reads prometheus.yml and tekton-rules.yml from the ConfigMap
# prometheus-config. It reads them only when it starts: restart the
# Deployment after a change.
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  # This configuration has two faults: the Tekton job scrapes port 8080
  # (the probes port of the controller Service, not the metrics port), and
  # the alert compares status with "failure", a value the metric never has.
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/tekton-rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: tekton-pipelines-controller
        static_configs:
          - targets: ["tekton-pipelines-controller.tekton-pipelines.svc:8080"]
  tekton-rules.yml: |
    groups:
      - name: tekton
        rules:
          - alert: TektonTaskRunFailed
            expr: sum(tekton_pipelines_controller_taskrun_total{status="failure"}) > 0
            labels:
              severity: warning
            annotations:
              summary: A TaskRun failed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=1d
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: monitoring
  labels:
    app: client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: client
          image: nicolaka/netshoot:v0.13
          command: ["sh", "-c", "while true; do sleep 30; done"]
