      - type: reading
        title: Question
        path: sections/section-030/capstone/labs/lab-01/question.md
      - type: lab
        title: "Repair Tekton Monitoring Capstone"
        path: sections/section-030/capstone/labs/lab-01
        difficulty: intermediate
        estimated_duration: 30m
        topic: monitoring
        task_kind: troubleshooting
        tags: [config-observability, metrics, prometheus, scrape-config, alerting-rules, promql]
        learning_goals:
          - Find why Prometheus has no Tekton metrics, on the Tekton side and on the Prometheus side
          - Fix an alert whose label selector can never match
          - Prove the repair with a failed TaskRun that fires the alert
        resources:
          - name: "Pipeline controller metrics"
            url: https://tekton.dev/docs/pipelines/metrics/
          - name: "Additional configuration options"
            url: https://tekton.dev/docs/pipelines/additional-configs/
      - type: quiz
        title: "Knowledge Check: Monitor Tekton With Prometheus"
        path: sections/section-030/quiz.yaml
        pass_score: 70
      - type: quiz
